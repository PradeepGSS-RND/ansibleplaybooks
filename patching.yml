---
- name: Ubuntu Linux Patch Management
  hosts: all
  become: yes

  tasks:

    - name: Gather system facts
      ansible.builtin.setup:

    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"


    - name: Upgrade all Ubuntu packages
      ansible.builtin.apt:
        name: "*"
        state: latest
      when: ansible_os_family == "Debian"


    - name: Install needrestart package
      ansible.builtin.apt:
        name: needrestart
        state: present
      when: ansible_os_family == "Debian"


    - name: Check if reboot is required
      ansible.builtin.command:
        cmd: needrestart -b
      register: reboot_check
      changed_when: false
      failed_when: false
      when: ansible_os_family == "Debian"


    - name: Display reboot status
      ansible.builtin.debug:
        msg: "{{ reboot_check.stdout_lines }}"
      when: ansible_os_family == "Debian"


    - name: Reboot server if required
      ansible.builtin.reboot:
        reboot_timeout: 900
        connect_timeout: 10
        test_command: uptime
      when:
        - ansible_os_family == "Debian"
        - "'NEEDRESTART-SVC' in reboot_check.stdout or 'NEEDRESTART-KSTA' in reboot_check.stdout"


    - name: Verify server uptime after reboot
      ansible.builtin.command:
        cmd: uptime
      register: uptime_check

    - name: Show uptime
      ansible.builtin.debug:
        var: uptime_check.stdout
